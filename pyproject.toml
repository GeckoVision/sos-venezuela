[project]
name = "ayuda-venezuela-bot"
version = "0.1.0"
description = "Spanish-first Telegram bot giving Venezuelans clear emergency info — an AI agent over the SOS Venezuela 2026 API, powered by Gecko."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    # The comprehension engine. Public, MIT. This is what makes the bot
    # first-call-correct against the humanitarian APIs. The `events` extra adds
    # pymongo so the bot emits control-plane-safe usage telemetry when MONGODB_URI
    # is set (silent no-op otherwise).
    "gecko-surf[events]>=0.2.0",
    # LLM providers (the agent loop) + Telegram transport.
    "anthropic>=0.40",
    "openai>=1.40",
    "python-telegram-bot>=21",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bot"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
